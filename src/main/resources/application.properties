spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# Conexión a PostgreSQL (con variables de entorno y fallback local)
Conexión a PostgreSQL (con variables de entorno y fallback local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tp2_db?options=-c%20TimeZone=UTC}
spring.datasource.username=${DB_USERNAME:mi_usuario}
spring.datasource.password=${DB_PASSWORD:mi_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/tp2_db?options=-c%20TimeZone=UTC}
spring.flyway.user=${DB_USERNAME:mi_usuario}
spring.flyway.password=${DB_PASSWORD:mi_password}

# Configuración de JWT
jwt.secret=${JWT_SECRET:una-clave-secreta-muy-larga-y-segura-para-firmar-el-token-1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}